spring:
  config:
    import: optional:application-secret.yml

  datasource:
    url: jdbc:mysql://ocb.iptime.org:3309/mapmo
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.pbl.mapmo: DEBUG
