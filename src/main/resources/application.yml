spring:
  security:
    oauth2:
      client:
        registration:
          google:
            scope: profile, email

          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, profile_image, account_email
            client-name: Kakao

          naver:
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: nickname, email, profile_image
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  redis:
    host: ocb.iptime.org
    port: 6379
    timeout: 2000

  config:
    import: optional:application-secret.yml

  datasource:
    url: jdbc:mysql://ocb.iptime.org:3309/MAP_MO
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html            # 접속 경로 (브라우저)
    display-request-duration: true    # 요청 소요 시간 표시
    tags-sorter: alpha                # 태그 알파벳순 정렬
    operations-sorter: method         # 같은 태그 내에서는 HTTP 메서드 순
    doc-expansion: list               # 기본 펼침 상태(list | full | none)

  api-docs:
    path: /v3/api-docs                # JSON 스펙 엔드포인트

  group-configs:
    - group: auth
      display-name: Auth-API
      paths-to-match:
        - /api/authenticate
        - /api/signup
        - /api/refresh
        - /api/oauth/**
        - /api/users/**
    - group: core
      display-name: Core-API
      paths-to-match:
        - /api/brands/**
        - /api/comments/**
        - /api/schedules/**
        - /api/shared-schedules/**

jwt:
  token-validity-in-seconds: 86400 # 24시간

server:
  port: 8080

logging:
  level:
    root: INFO
    com.pbl.mapmo: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.redis: DEBUG
    com.pbl.mapmo.jwt: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
